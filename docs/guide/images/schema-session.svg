<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Le parcours d'une session d'agent dans Filigree"><title>Le parcours d'une session d'agent dans Filigree</title><defs><marker id="head-6F5BD3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F5BD3"/></marker><marker id="head-2F6B4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B4F"/></marker><marker id="head-A0661A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A0661A"/></marker><marker id="head-6B6559" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6559"/></marker><marker id="head-A3452C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3452C"/></marker></defs><rect width="100%" height="100%" fill="#FBFAFE"/><text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1F1B2E">Le parcours d'une session</text><text x="620" y="62" text-anchor="middle" font-size="13" font-weight="400" fill="#6B6559">De votre commande « claude » à la connaissance acceptée que lira l'agent suivant.</text><rect x="30" y="110" width="176" height="96" rx="10" fill="#EEEAF8" stroke="#B9B0DA" stroke-width="1.5"/><text x="118.0" y="142.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Vous lancez</text><text x="118.0" y="162.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">claude ou codex</text><text x="118.0" y="182.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">dans ~/code/app</text><text x="118" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5BD3">1</text><line x1="208" y1="158" x2="228" y2="158" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="230" y="110" width="176" height="96" rx="10" fill="#EEEAF8" stroke="#B9B0DA" stroke-width="1.5"/><text x="318.0" y="142.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">L'application écrit</text><text x="318.0" y="162.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">sa transcription</text><text x="318.0" y="182.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">sur votre disque</text><text x="318" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5BD3">2</text><line x1="408" y1="158" x2="428" y2="158" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="430" y="110" width="176" height="96" rx="10" fill="#EEEAF8" stroke="#B9B0DA" stroke-width="1.5"/><text x="518.0" y="142.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">L'agent Filigree lit</text><text x="518.0" y="162.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">les nouvelles lignes</text><text x="518.0" y="182.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">toutes les 5 s</text><text x="518" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5BD3">3</text><line x1="608" y1="158" x2="628" y2="158" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="630" y="110" width="176" height="96" rx="10" fill="#FFFFFF" stroke="#B9B0DA" stroke-width="1.5"/><text x="718.0" y="142.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Dossier → projet</text><text x="718.0" y="162.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">« app » trouvé</text><text x="718.0" y="182.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">(racines autorisées)</text><text x="718" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5BD3">4</text><line x1="808" y1="158" x2="828" y2="158" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="830" y="110" width="176" height="96" rx="10" fill="#FFFFFF" stroke="#B9B0DA" stroke-width="1.5"/><text x="918.0" y="142.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Journal d'activité</text><text x="918.0" y="162.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">demandes, fichiers,</text><text x="918.0" y="182.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">tests, erreurs, commits</text><text x="918" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5BD3">5</text><line x1="1008" y1="158" x2="1028" y2="158" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="1030" y="110" width="176" height="96" rx="10" fill="#FFFFFF" stroke="#B9B0DA" stroke-width="1.5"/><text x="1118.0" y="142.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Fiche de session</text><text x="1118.0" y="162.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">après 10 min d'inactivité</text><text x="1118.0" y="182.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">ou fin de session</text><text x="1118" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6F5BD3">6</text><line x1="1118" y1="208" x2="1118" y2="268" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="990" y="270" width="220" height="80" rx="10" fill="#FBF1E1" stroke="#A0661A" stroke-width="1.5"/><text x="1100.0" y="304.9" text-anchor="middle" font-size="14" font-weight="600" fill="#A0661A">Vous examinez</text><text x="1100.0" y="324.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">Accepter · Écarter · Modifier</text><line x1="988" y1="310" x2="742" y2="310" stroke="#2F6B4F" stroke-width="2" marker-end="url(#head-2F6B4F)"/><text x="865.0" y="304.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2F6B4F">acceptée</text><rect x="520" y="270" width="220" height="80" rx="10" fill="#E6F2EC" stroke="#2F6B4F" stroke-width="1.5"/><text x="630.0" y="304.9" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6B4F">Connaissance actuelle</text><text x="630.0" y="324.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">dans la mémoire du projet</text><line x1="518" y1="310" x2="282" y2="310" stroke="#2F6B4F" stroke-width="2" marker-end="url(#head-2F6B4F)"/><text x="400.0" y="304.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2F6B4F">MCP · hook --inject · reprise</text><rect x="60" y="270" width="220" height="80" rx="10" fill="#E6F2EC" stroke="#2F6B4F" stroke-width="1.5"/><text x="170.0" y="304.9" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6B4F">L'agent suivant</text><text x="170.0" y="324.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">repart du bon contexte</text><text x="620" y="400" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">Ce qui n'est jamais conservé : lignes de commande complètes, raisonnement interne du modèle, blocs injectés, historique antérieur au premier lancement.</text><text x="620" y="420" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">Les résumés sont expurgés (secrets connus masqués) avant d'être coupés à 280 caractères.</text></svg>
