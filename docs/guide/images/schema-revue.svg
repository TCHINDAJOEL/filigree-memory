<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="380" viewBox="0 0 1240 380" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Cycle de vie d'une connaissance"><title>Cycle de vie d'une connaissance</title><defs><marker id="head-6F5BD3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F5BD3"/></marker><marker id="head-2F6B4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B4F"/></marker><marker id="head-A0661A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A0661A"/></marker><marker id="head-6B6559" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6559"/></marker><marker id="head-A3452C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3452C"/></marker></defs><rect width="100%" height="100%" fill="#FBFAFE"/><text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1F1B2E">Personne d'autre que vous ne décide</text><text x="620" y="62" text-anchor="middle" font-size="13" font-weight="400" fill="#6B6559">Tout ce qui vient d'un agent, d'une capture ou d'un import entre comme proposition ; seule l'interface locale accepte.</text><rect x="40" y="100" width="230" height="54" rx="10" fill="#FFFFFF" stroke="#B9B0DA" stroke-width="1.5"/><text x="155.0" y="131.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Capture automatique</text><line x1="272" y1="127" x2="396" y2="207" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="40" y="180" width="230" height="54" rx="10" fill="#FFFFFF" stroke="#B9B0DA" stroke-width="1.5"/><text x="155.0" y="211.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Agent via MCP</text><line x1="272" y1="207" x2="396" y2="207" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="40" y="260" width="230" height="54" rx="10" fill="#FFFFFF" stroke="#B9B0DA" stroke-width="1.5"/><text x="155.0" y="291.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B2E">Import / export de chat</text><line x1="272" y1="287" x2="396" y2="207" stroke="#6F5BD3" stroke-width="2" marker-end="url(#head-6F5BD3)"/><rect x="400" y="170" width="200" height="74" rx="10" fill="#FBF1E1" stroke="#A0661A" stroke-width="1.5"/><text x="500.0" y="201.9" text-anchor="middle" font-size="14" font-weight="600" fill="#A0661A">À examiner</text><text x="500.0" y="221.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">proposed</text><line x1="602" y1="190" x2="756" y2="130" stroke="#2F6B4F" stroke-width="2" marker-end="url(#head-2F6B4F)"/><text x="679.0" y="154.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2F6B4F">Accepter</text><line x1="602" y1="228" x2="756" y2="284" stroke="#A3452C" stroke-width="2" marker-end="url(#head-A3452C)"/><text x="679.0" y="274.0" text-anchor="middle" font-size="12" font-weight="400" fill="#A3452C">Écarter</text><rect x="760" y="96" width="200" height="74" rx="10" fill="#E6F2EC" stroke="#2F6B4F" stroke-width="1.5"/><text x="860.0" y="127.9" text-anchor="middle" font-size="14" font-weight="600" fill="#2F6B4F">Acceptée</text><text x="860.0" y="147.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">accepted : actuelle</text><rect x="760" y="250" width="200" height="74" rx="10" fill="#F8E6E3" stroke="#A3452C" stroke-width="1.5"/><text x="860.0" y="281.9" text-anchor="middle" font-size="14" font-weight="600" fill="#A3452C">Écartée</text><text x="860.0" y="301.9" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">rejected : historique</text><line x1="962" y1="133" x2="1036" y2="133" stroke="#6B6559" stroke-width="2" marker-end="url(#head-6B6559)"/><rect x="1040" y="96" width="170" height="74" rx="10" fill="#F1EFF5" stroke="#6B6559" stroke-width="1.5"/><text x="1125.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#6B6559">Remplacée</text><text x="1125.0" y="147.1" text-anchor="middle" font-size="11" font-weight="400" fill="#6B6559">par une décision plus récente</text><text x="1125" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">jamais effacée :</text><text x="1125" y="218" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">reste dans l'historique</text><text x="620" y="356" text-anchor="middle" font-size="12" font-weight="400" fill="#6B6559">Chaque changement crée une révision. Les reprises séparent l'actuel (acceptée), l'incertain (à examiner) et l'historique (écartée, remplacée).</text></svg>
